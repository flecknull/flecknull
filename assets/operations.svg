    <rect class="box" x="14" y="16" width="52" height="52" rx="6"/>
    <circle class="ic" cx="40" cy="36" r="4"/><circle class="ic" cx="29" cy="39" r="3.2"/><circle class="ic" cx="51" cy="39" r="3.2"/>
    <path class="ic" d="M32 54v-3a8 8 0 0 1 16 0v3zM22 54v-2a6 6 0 0 1 9-5M58 54v-2a6 6 0 0 0-9-5"/>
