<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
  <defs>
    <style>
      .m{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
      .ic{fill:none;stroke:#3ddc84;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#0d1117;stroke:#2a3a33}
      .card{fill:#0f141a}
      .t{fill:#e6edf3;font-size:15px;font-weight:700}
      .s{fill:#8b949e;font-size:13px}
    </style>
  </defs>

  <g class="m">
    <text x="4" y="26" font-size="20" fill="#3ddc84" letter-spacing="2">01  /</text>
    <text x="96" y="26" font-size="20" fill="#e6edf3" letter-spacing="3" font-weight="700">CURRENT OPERATIONS</text>
  </g>
  <line x1="378" y1="19" x2="996" y2="19" stroke="#30363d"/>

  <!-- Linux -->
  <g transform="translate(4,52)">
    <rect class="card" width="234" height="108" rx="6"/>
    <rect class="box" x="14" y="16" width="52" height="52" rx="6"/>
    <rect class="ic" x="25" y="29" width="30" height="26" rx="2"/>
    <path class="ic" d="M31 37l5 4-5 4M39 47h8"/>
    <g class="m"><text class="t" x="84" y="34">Linux</text>
    <text class="s" x="84" y="58">Systems and</text><text class="s" x="84" y="77">administration</text></g>
  </g>

  <!-- Automation -->
  <g transform="translate(256,52)">
