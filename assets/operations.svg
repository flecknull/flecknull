    <rect class="box" x="14" y="16" width="52" height="52" rx="6"/>
    <circle class="ic" cx="40" cy="42" r="5"/>
    <path class="ic" d="M40 29v4M40 51v4M27 42h4M49 42h4M30.8 32.8l2.8 2.8M46.4 48.4l2.8 2.8M30.8 51.2l2.8-2.8M46.4 35.6l2.8-2.8"/>
    <circle class="ic" cx="40" cy="42" r="10"/>
    <g class="m"><text class="t" x="84" y="34">Automation</text>
    <text class="s" x="84" y="58">Practical tools</text><text class="s" x="84" y="77">and workflows</text></g>
  </g>

  <!-- AI -->
  <g transform="translate(508,52)">
    <rect class="card" width="234" height="108" rx="6"/>
    <rect class="box" x="14" y="16" width="52" height="52" rx="6"/>
    <path class="ic" d="M40 29c-3-3-9-2-10 3-4 1-5 6-2 9-3 3-1 8 3 9 1 5 7 6 9 3zM40 29c3-3 9-2 10 3 4 1 5 6 2 9 3 3 1 8-3 9-1 5-7 6-9 3zM40 29v24M34 37h3l2 3M46 37h-3l-2 3M34 47h4M46 47h-4"/>
    <g class="m"><text class="t" x="84" y="34">AI</text>
    <text class="s" x="84" y="58">Intelligent systems</text><text class="s" x="84" y="77">and experiments</text></g>
  </g>

