      <text class="t" x="0" y="126">Share what</text><text class="t" x="0" y="146">is useful.</text>
    </g>
    <g transform="translate(796,0)">
      <text class="num" x="0" y="88">04</text><rect x="0" y="98" width="14" height="2" fill="#3ddc84"/>
      <text class="t" x="0" y="126">Keep</text><text class="t" x="0" y="146">evolving.</text>
