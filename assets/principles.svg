<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180">
  <defs>
    <style>
      .m{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
      .num{fill:#3ddc84;font-size:22px}
      .t{fill:#c9d1d9;font-size:15px}
    </style>
  </defs>

  <g class="m">
    <text x="4" y="26" font-size="20" fill="#3ddc84" letter-spacing="2">03  /</text>
    <text x="96" y="26" font-size="20" fill="#e6edf3" letter-spacing="3" font-weight="700">OPERATING PRINCIPLES</text>
  </g>
  <line x1="408" y1="19" x2="996" y2="19" stroke="#30363d"/>

  <rect x="4" y="50" width="992" height="124" rx="6" fill="#0b0f14" stroke="#1f2a33"/>
  <g stroke="#30363d">
    <line x1="268" y1="66" x2="268" y2="158"/>
    <line x1="516" y1="66" x2="516" y2="158"/>
    <line x1="764" y1="66" x2="764" y2="158"/>
  </g>

  <g class="m">
    <g transform="translate(36,0)">
      <text class="num" x="0" y="88">01</text><rect x="0" y="98" width="14" height="2" fill="#3ddc84"/>
      <text class="t" x="0" y="126">Understand</text><text class="t" x="0" y="146">before automating.</text>
    </g>
    <g transform="translate(300,0)">
      <text class="num" x="0" y="88">02</text><rect x="0" y="98" width="14" height="2" fill="#3ddc84"/>
      <text class="t" x="0" y="126">Build</text><text class="t" x="0" y="146">before boasting.</text>
    </g>
    <g transform="translate(548,0)">
