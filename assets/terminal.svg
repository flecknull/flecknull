<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <style>
      .m{font-family:ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
      .p{fill:#3ddc84}.c{fill:#e6edf3}.o{fill:#c9d1d9}.d{fill:#6e7681}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .l{opacity:0;animation:in .01s forwards}
      @keyframes in{to{opacity:1}}
      .art{fill:none;stroke:#8b949e;stroke-width:1.2;stroke-dasharray:4 4;opacity:.75}
      .dash{animation:march 20s linear infinite}
      @keyframes march{to{stroke-dashoffset:-200}}
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="398" rx="10" fill="#0d1117" stroke="#1f2a33"/>
  <path d="M1 11a10 10 0 0 1 10-10h978a10 10 0 0 1 10 10v29H1z" fill="#11161d"/>
  <line x1="1" y1="40" x2="999" y2="40" stroke="#1f2a33"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="m d" x="976" y="25" font-size="12" text-anchor="end">guest@fleck:~</text>

  <g class="m" font-size="16">
    <text class="l" style="animation-delay:.2s" x="26" y="78"><tspan class="p">guest@fleck:~$</tspan><tspan class="c"> whoami</tspan></text>
    <text class="l o" style="animation-delay:.6s" x="26" y="100">Fleck Null</text>

    <text class="l" style="animation-delay:1.1s" x="26" y="136"><tspan class="p">guest@fleck:~$</tspan><tspan class="c"> cat mission.txt</tspan></text>
    <text class="l o" style="animation-delay:1.5s" x="26" y="158">Building useful tools.</text>
    <text class="l o" style="animation-delay:1.7s" x="26" y="180">Understanding systems.</text>
    <text class="l o" style="animation-delay:1.9s" x="26" y="202">Automating the repetitive.</text>
    <text class="l o" style="animation-delay:2.1s" x="26" y="224">Connecting beyond borders.</text>

    <text class="l" style="animation-delay:2.6s" x="26" y="260"><tspan class="p">guest@fleck:~$</tspan><tspan class="c"> ls interests/</tspan></text>
    <text class="l o" style="animation-delay:3s" x="26" y="282" xml:space="preserve">linux/  automation/  ai/  open-source/</text>

    <text class="l" style="animation-delay:3.5s" x="26" y="318"><tspan class="p">guest@fleck:~$</tspan><tspan class="c"> echo $SIGNAL</tspan></text>
    <text class="l o" style="animation-delay:3.9s" x="26" y="340">01000110 01001100</text>

    <g class="l" style="animation-delay:4.3s">
      <text x="26" y="376"><tspan class="p">guest@fleck:~$</tspan></text>
      <rect class="blink" x="166" y="372" width="10" height="3" fill="#e6edf3"/>
    </g>
  </g>

  <!-- dashed blueprint glyph -->
  <g class="art dash">
    <path d="M735 92h56M835 92h56M735 92l-28 48M891 92l28 48M707 140h212"/>
    <path d="M791 92v48M835 92v48M791 140v48h44v-48"/>
    <path d="M707 196h212v56h-212z"/>
    <path d="M791 196v56M835 196v56"/>
    <path d="M751 252v52h132v-52"/>
  </g>
  <g class="m d" font-size="12">
    <text x="762" y="336"># SAME SYSTEM</text>
    <text x="762" y="354"># DIFFERENT PERSPECTIVE</text>
    <text x="762" y="372"># ALWAYS LEARNING</text>
  </g>
  <rect class="blink" x="762" y="382" width="12" height="3" fill="#3ddc84"/>
</svg>
